<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Drift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="hud-item"><span>Score</span><strong id="score">0</strong></div>
        <div class="hud-item"><span>Health</span><strong id="health">100</strong></div>
        <div class="hud-item"><span>Time</span><strong id="time">45</strong></div>
      </div>

      <canvas id="gameCanvas" width="820" height="520" aria-label="Game canvas"></canvas>

      <div class="controls">
        <button id="startButton">Start Run</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
